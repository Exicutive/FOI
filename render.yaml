services:
  - type: web
    name: foi-developments
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build:site
    staticPublishPath: dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.google.com; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
    routes:
      - type: redirect
        source: /pages/about.html
        destination: /about
      - type: redirect
        source: /pages/contact.html
        destination: /contact
      - type: redirect
        source: /pages/development.html
        destination: /development
      - type: redirect
        source: /pages/properties.html
        destination: /properties
      - type: redirect
        source: /pages/property.html
        destination: /properties
      - type: redirect
        source: /pages/development-detail.html
        destination: /development
      - type: rewrite
        source: /about
        destination: /_internal/pages/about.html
      - type: rewrite
        source: /contact
        destination: /_internal/pages/contact.html
      - type: rewrite
        source: /development
        destination: /_internal/pages/development.html
      - type: rewrite
        source: /properties
        destination: /_internal/pages/properties.html
      - type: rewrite
        source: /property/tmlse
        destination: /_internal/pages/property-tmlse.html
      - type: rewrite
        source: /property/tfgse
        destination: /_internal/pages/property-tfgse.html
      - type: rewrite
        source: /property/mbe
        destination: /_internal/pages/property-mbe.html
      - type: rewrite
        source: /property/qpe
        destination: /_internal/pages/property-qpe.html
      - type: rewrite
        source: /property/oge
        destination: /_internal/pages/property-oge.html
      - type: rewrite
        source: /property/ctv
        destination: /_internal/pages/property-ctv.html
      - type: rewrite
        source: /development/site-feasibility
        destination: /_internal/pages/development-site-feasibility.html
      - type: rewrite
        source: /development/design-approvals
        destination: /_internal/pages/development-design-approvals.html
      - type: rewrite
        source: /development/construction-handover
        destination: /_internal/pages/development-construction-handover.html
      - type: rewrite
        source: /property/:slug
        destination: /_internal/pages/property.html
      - type: rewrite
        source: /development/:slug
        destination: /_internal/pages/development-detail.html
